<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warhammer 40,000 — Imperium</title>
    <style>
      :root {
        --gold: #d4af37;
        --gold-soft: #8f6b1a;
        --steel: #171a23;
        --void: #090a0f;
        --blood: #6f1111;
        --smoke: #c5c8d3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at 15% 20%, rgba(111, 17, 17, 0.35), transparent 45%),
          radial-gradient(circle at 85% 25%, rgba(212, 175, 55, 0.2), transparent 40%),
          linear-gradient(145deg, #0e1018 0%, #090a0f 50%, #11121a 100%);
        color: var(--smoke);
      }

      .noise {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.12;
        background-image: radial-gradient(circle, rgba(255, 255, 255, 0.28) 0.4px, transparent 0.7px);
        background-size: 2.5px 2.5px;
      }

      .header {
        position: fixed;
        inset: 1rem 1rem auto;
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
        z-index: 10;
      }

      .search-form {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem;
        border-radius: 0.75rem;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.15);
      }

      .search-input {
        width: min(50vw, 16rem);
        border: 1px solid #93c5fd;
        border-radius: 0.5rem;
        padding: 0.55rem 0.7rem;
        font-size: 0.95rem;
      }

      .search-button {
        border: none;
        border-radius: 0.5rem;
        background: #2563eb;
        color: #fff;
        padding: 0.55rem 0.9rem;
        font-size: 0.9rem;
        cursor: pointer;
      }

      .search-button:hover,
      .search-button:focus-visible {
        background: #1d4ed8;
      }

      .menu-button {
        width: 3rem;
        height: 3rem;
        border: 1px solid var(--gold);
        border-radius: 0.4rem;
        background: rgba(9, 10, 15, 0.9);
        color: var(--gold);
        cursor: pointer;
        display: inline-flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.25rem;
        padding: 0.65rem;
        box-shadow: 0 0 16px rgba(212, 175, 55, 0.2);
      }

      .menu-button span {
        display: block;
        width: 100%;
        height: 0.18rem;
        background: currentColor;
      }

      .menu-wrapper {
        position: relative;
      }

      .menu {
        position: fixed;
        top: 4.75rem;
        right: 1rem;
        min-width: 12rem;
        background: rgba(11, 12, 18, 0.95);
        border: 1px solid var(--gold-soft);
        border-radius: 0.4rem;
        padding: 0.5rem;
        list-style: none;
        margin: 0;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      }

      .menu[hidden] {
        display: none;
      }

      .menu a {
        display: block;
        color: var(--smoke);
        text-decoration: none;
        padding: 0.65rem 0.75rem;
        border-radius: 0.25rem;
      }

      .menu a:hover,
      .menu a:focus-visible {
        background: rgba(212, 175, 55, 0.15);
        color: #f8ebc6;
      }

      .search-result {
        margin: 0;
        font-size: 1.15rem;
        color: #1e3a8a;
        text-align: center;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      .hero {
        width: min(920px, 100%);
        border: 1px solid var(--gold-soft);
        background:
          linear-gradient(180deg, rgba(17, 18, 26, 0.88), rgba(9, 10, 15, 0.95)),
          linear-gradient(45deg, rgba(111, 17, 17, 0.15), transparent 55%);
        padding: clamp(1.5rem, 3.5vw, 3rem);
        box-shadow:
          inset 0 0 0 1px rgba(212, 175, 55, 0.15),
          0 20px 60px rgba(0, 0, 0, 0.5);
        text-align: center;
      }

      .hero-mark {
        color: var(--gold);
        font-size: clamp(0.85rem, 1.2vw, 1rem);
        letter-spacing: 0.3em;
        text-transform: uppercase;
        margin-bottom: 1rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5.5vw, 4.2rem);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        line-height: 1.08;
        color: #f3d98d;
        text-shadow: 0 0 24px rgba(212, 175, 55, 0.25);
      }

      .hero-subtitle {
        margin: 1rem auto 0;
        max-width: 42ch;
        color: #c9cbd4;
        font-size: clamp(1rem, 1.6vw, 1.2rem);
      }

      .hero-seal {
        margin: 1.75rem auto 0;
        width: 4.25rem;
        height: 4.25rem;
        border: 2px solid var(--gold);
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--gold);
        font-weight: 700;
        font-size: 0.85rem;
        letter-spacing: 0.15em;
      }
    </style>
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>

    <header class="header">
      <button class="menu-button" id="menuButton" aria-expanded="false" aria-controls="mainMenu" aria-label="Открыть навигацию">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="menu" id="mainMenu" hidden>
        <li><a href="#">Империум</a></li>
        <li><a href="#">Кампании</a></li>
        <li><a href="#">Орден</a></li>
      </ul>
    </header>

    <main>
      <section class="hero" aria-label="Заставка сайта">
        <div class="hero-mark">Warhammer 40,000</div>
        <h1>Во мраке далёкого будущего<br />есть только война</h1>
        <p class="hero-subtitle">Добро пожаловать в сектор, где каждый день начинается с клятвы Императору и заканчивается битвой за выживание человечества.</p>
        <div class="hero-seal">XL M</div>
      </section>
    </main>

    <script>
      const button = document.getElementById('menuButton');
      const menu = document.getElementById('mainMenu');
      const searchForm = document.getElementById('searchForm');
      const searchInput = document.getElementById('searchInput');
      const searchResult = document.getElementById('searchResult');

      button.addEventListener('click', () => {
        const isExpanded = button.getAttribute('aria-expanded') === 'true';
        button.setAttribute('aria-expanded', String(!isExpanded));
        menu.hidden = isExpanded;
      });

      searchForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const query = searchInput.value.trim();

        if (!query) {
          searchResult.hidden = false;
          searchResult.textContent = 'Введите запрос для поиска.';
          return;
        }

        searchResult.hidden = false;
        searchResult.textContent = `Результат поиска: «${query}»`;
      });
    </script>
  </body>
</html>
