<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef2ff, #dbeafe);
      }

      .header {
        position: fixed;
        inset: 1rem 1rem auto;
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
        z-index: 10;
      }

      .search-form {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem;
        border-radius: 0.75rem;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.15);
      }

      .search-input {
        width: min(50vw, 16rem);
        border: 1px solid #93c5fd;
        border-radius: 0.5rem;
        padding: 0.55rem 0.7rem;
        font-size: 0.95rem;
      }

      .search-button {
        border: none;
        border-radius: 0.5rem;
        background: #2563eb;
        color: #fff;
        padding: 0.55rem 0.9rem;
        font-size: 0.9rem;
        cursor: pointer;
      }

      .search-button:hover,
      .search-button:focus-visible {
        background: #1d4ed8;
      }

      .menu-button {
        width: 3rem;
        height: 3rem;
        border: none;
        border-radius: 0.75rem;
        background: #1e3a8a;
        color: #fff;
        cursor: pointer;
        display: inline-flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.25rem;
        padding: 0.65rem;
      }

      .menu-button span {
        display: block;
        width: 100%;
        height: 0.2rem;
        background: currentColor;
        border-radius: 1rem;
      }

      .menu-wrapper {
        position: relative;
      }

      .menu {
        position: fixed;
        top: 4.75rem;
        right: 1rem;
        min-width: 10rem;
        background: rgba(30, 58, 138, 0.95);
        border-radius: 0.75rem;
        padding: 0.5rem;
        list-style: none;
        margin: 0;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.25);
      }

      .menu[hidden] {
        display: none;
      }

      .menu a {
        display: block;
        color: #fff;
        text-decoration: none;
        padding: 0.65rem 0.75rem;
        border-radius: 0.5rem;
      }

      .menu a:hover,
      .menu a:focus-visible {
        background: rgba(255, 255, 255, 0.15);
      }

      .search-result {
        margin: 0;
        font-size: 1.15rem;
        color: #1e3a8a;
        text-align: center;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 6vw, 4.5rem);
        color: #1e3a8a;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <form class="search-form" id="searchForm" role="search" aria-label="Поиск по странице">
        <input
          class="search-input"
          id="searchInput"
          type="search"
          placeholder="Введите запрос"
          autocomplete="off"
        />
        <button class="search-button" type="submit">Найти</button>
      </form>
      <div class="menu-wrapper">
        <button class="menu-button" id="menuButton" aria-expanded="false" aria-controls="mainMenu" aria-label="Open navigation menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <ul class="menu" id="mainMenu" hidden>
          <li><a href="#">Главная</a></li>
          <li><a href="#">О нас</a></li>
          <li><a href="#">Контакты</a></li>
        </ul>
      </div>
    </header>

    <main>
      <div>
        <h1>Hello, World!</h1>
        <p class="search-result" id="searchResult" hidden></p>
      </div>
    </main>

    <script>
      const button = document.getElementById('menuButton');
      const menu = document.getElementById('mainMenu');
      const searchForm = document.getElementById('searchForm');
      const searchInput = document.getElementById('searchInput');
      const searchResult = document.getElementById('searchResult');

      button.addEventListener('click', () => {
        const isExpanded = button.getAttribute('aria-expanded') === 'true';
        button.setAttribute('aria-expanded', String(!isExpanded));
        menu.hidden = isExpanded;
      });

      searchForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const query = searchInput.value.trim();

        if (!query) {
          searchResult.hidden = false;
          searchResult.textContent = 'Введите запрос для поиска.';
          return;
        }

        searchResult.hidden = false;
        searchResult.textContent = `Результат поиска: «${query}»`;
      });
    </script>
  </body>
</html>
