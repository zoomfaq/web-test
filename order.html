<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Орден — Видеобрифинг</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: radial-gradient(circle at top, #2a220f, #090a0f 60%);
        color: #f0e6c8;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .panel {
        width: min(960px, 100%);
        padding: clamp(1rem, 3vw, 2rem);
        border: 1px solid #d4af37;
        background: rgba(9, 10, 15, 0.85);
        box-shadow: 0 0 24px rgba(212, 175, 55, 0.2);
      }

      h1 {
        margin-top: 0;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        text-align: center;
      }

      .player {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 1px solid rgba(212, 175, 55, 0.55);
      }

      .player iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }

      .actions {
        margin-top: 1rem;
        display: flex;
        justify-content: space-between;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      a {
        color: #d4af37;
      }
    </style>
  </head>
  <body>
    <section class="panel" aria-label="Страница ордена">
      <h1>Орден</h1>
      <div class="player">
        <iframe
          src="https://www.youtube.com/embed/sbgYaeerXh"
          title="YouTube video player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>
      <div class="actions">
        <a href="index.html">Вернуться на главную</a>
        <a href="https://www.youtube.com/watch?v=sbgYaeerXhg" target="_blank" rel="noopener noreferrer">Открыть видео на YouTube</a>
      </div>
    </section>
  </body>
</html>
