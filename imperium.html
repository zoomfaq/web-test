<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Империум Человечества</title>
    <style>
      :root {
        --gold: #d4af37;
        --gold-soft: #8f6b1a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #2a220f, #090a0f 60%);
        color: #f0e6c8;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .home-link {
        position: fixed;
        top: -0.5rem;
        left: 1rem;
        z-index: 12;
        width: 6rem;
        height: 6rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .home-link img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .menu-wrapper {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 11;
      }

      .menu-button {
        width: 3rem;
        height: 3rem;
        border: 1px solid var(--gold);
        border-radius: 0.4rem;
        background: rgba(9, 10, 15, 0.9);
        color: var(--gold);
        cursor: pointer;
        display: inline-flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.25rem;
        padding: 0.65rem;
      }

      .menu-button span {
        display: block;
        width: 100%;
        height: 0.18rem;
        background: currentColor;
      }

      .menu {
        position: fixed;
        top: 4.75rem;
        right: 1rem;
        min-width: 12rem;
        background: rgba(11, 12, 18, 0.95);
        border: 1px solid var(--gold-soft);
        border-radius: 0.4rem;
        padding: 0.5rem;
        list-style: none;
        margin: 0;
      }

      .menu[hidden] {
        display: none;
      }

      .menu a {
        display: block;
        color: #f0e6c8;
        text-decoration: none;
        padding: 0.65rem 0.75rem;
        border-radius: 0.25rem;
      }

      .menu a:hover,
      .menu a:focus-visible {
        background: rgba(212, 175, 55, 0.15);
      }

      .panel {
        max-width: 44rem;
        margin: 1.5rem;
        padding: 2rem;
        border: 1px solid #d4af37;
        background: rgba(9, 10, 15, 0.85);
        box-shadow: 0 0 24px rgba(212, 175, 55, 0.2);
        text-align: center;
      }

      h1 {
        margin-top: 0;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      a {
        color: #d4af37;
      }
    </style>
  </head>
  <body>
    <a class="home-link" href="index.html" aria-label="На главную">
      <img src="ChatGPT Image 1 мар. 2026 г., 03_44_17.png" alt="Логотип главной страницы" />
    </a>

    <div class="menu-wrapper">
      <button class="menu-button" id="menuButton" aria-expanded="false" aria-controls="mainMenu" aria-label="Открыть навигацию">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="menu" id="mainMenu" hidden>
        <li><a href="index.html">Домой</a></li>
        <li><a href="imperium.html">Империум</a></li>
        <li><a href="order.html">Орден</a></li>
      </ul>
    </div>

    <section class="panel" aria-label="Страница Империума">
      <h1>Империум Человечества</h1>
      <p>Вы открыли отдельную страницу Империума. Служите Императору и храните рубежи человечества!</p>
      <p><a href="index.html">Вернуться на главную</a></p>
    </section>

    <script>
      const button = document.getElementById('menuButton');
      const menu = document.getElementById('mainMenu');

      button.addEventListener('click', () => {
        const isExpanded = button.getAttribute('aria-expanded') === 'true';
        button.setAttribute('aria-expanded', String(!isExpanded));
        menu.hidden = isExpanded;
      });
    </script>
  </body>
</html>
